<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&family=Be+Vietnam+Pro:wght@300;400&display=swap" rel="stylesheet">

<style>
/* ===== TOKENS ===== */
:root {
  --bg:       #111111;
  --ink:      #eeeeee;
  --mid:      #555555;
  --ring-bg:  #222222;
  --accent:   #e05555;
  --warn:     #d4920a;
  --safe:     #eeeeee;
  --font-num: 'Bebas Neue', Impact, sans-serif;
  --font-mono:'DM Mono', monospace;
  --font-body:'Be Vietnam Pro', sans-serif;
  --ease:     cubic-bezier(0.22, 1, 0.36, 1);
}

/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
  position: relative;
}

/* ===== PAPER TEXTURE ===== */
body::before { display: none; }

/* ===== BIG DECORATIVE NUMBER ===== */
.deco-num {
  position: fixed;
  bottom: -8vh;
  right: -2vw;
  font-family: var(--font-num);
  font-size: 40vw;
  color: rgba(26,16,8,0.03);
  line-height: 1;
  pointer-events: none;
  z-index: 0;
  user-select: none;
  transition: color 1s;
}

/* ===== MAIN WRAPPER ===== */
.wrapper {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}

/* ===== LABEL TOP ===== */
.label-top {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 32px;
  animation: fadeIn 0.8s var(--ease) 0.2s both;
}

/* ===== SVG RING ===== */
.ring-wrap {
  position: relative;
  width: min(340px, 80vw);
  height: min(340px, 80vw);
  animation: fadeIn 0.8s var(--ease) 0.1s both;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.ring-svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.ring-bg-circle {
  fill: none;
  stroke: var(--ring-bg);
  stroke-width: 3;
}

.ring-progress {
  fill: none;
  stroke: var(--safe);
  stroke-width: 3;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s linear, stroke 0.5s;
}

/* ===== TIME DISPLAY ===== */
.time-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.time-display {
  font-family: var(--font-num);
  font-size: clamp(5rem, 16vw, 8rem);
  letter-spacing: 0.04em;
  line-height: 1;
  color: var(--ink);
  transition: color 0.5s;
  position: relative;
}

/* Colon pulse */
.colon {
  display: inline-block;
  animation: none;
  opacity: 1;
}

.colon.pulse {
  animation: colonBlink 1s step-end infinite;
}

@keyframes colonBlink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.15; }
}

.time-sub {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing: 0.15em;
  color: var(--mid);
  text-transform: uppercase;
}

/* ===== WARNING STATES ===== */

/* Under 1 minute — amber pulse */
.time-display.warn { color: var(--warn); }

.ring-progress.warn { stroke: var(--warn); }

.ring-wrap.warn-active .ring-svg {
  animation: ringPulse 1s ease-in-out infinite;
}

@keyframes ringPulse {
  0%, 100% { filter: drop-shadow(0 0 0px rgba(232,160,32,0)); }
  50%       { filter: drop-shadow(0 0 12px rgba(232,160,32,0.4)); }
}

/* Under 10 seconds — red urgent */
.time-display.urgent { color: var(--accent); }

.ring-progress.urgent { stroke: var(--accent); }

.ring-wrap.urgent-active .ring-svg {
  animation: urgentPulse 0.5s ease-in-out infinite;
}

@keyframes urgentPulse {
  0%, 100% { filter: drop-shadow(0 0 0px rgba(212,69,10,0)); }
  50%       { filter: drop-shadow(0 0 16px rgba(212,69,10,0.5)); }
}

.time-display.urgent {
  animation: shake 0.5s ease-in-out infinite;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%       { transform: translateX(-3px); }
  40%       { transform: translateX(3px); }
  60%       { transform: translateX(-2px); }
  80%       { transform: translateX(2px); }
}

/* ===== CONTROLS ===== */
.controls {
  display: flex;
  gap: 12px;
  margin-top: 40px;
  animation: fadeIn 0.8s var(--ease) 0.4s both;
}

.btn {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 10px 24px;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.18s;
  border: 1.5px solid;
}

.btn-primary {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

.btn-primary:hover {
  background: #3a2a18;
  border-color: #3a2a18;
}

.btn-secondary {
  background: transparent;
  color: var(--mid);
  border-color: #d0c8b8;
}

.btn-secondary:hover {
  border-color: var(--ink);
  color: var(--ink);
}

.btn:active { transform: scale(0.96); }

/* ===== PROGRESS BAR (LINEAR) ===== */
.progress-bar-wrap {
  width: min(340px, 80vw);
  margin-top: 24px;
  animation: fadeIn 0.8s var(--ease) 0.5s both;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--mid);
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

.progress-track {
  height: 2px;
  background: var(--ring-bg);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--safe);
  border-radius: 2px;
  transition: width 1s linear, background 0.5s;
  width: 100%;
}

/* ===== CUSTOM DURATION INPUT ===== */
.duration-wrap {
  margin-top: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: fadeIn 0.8s var(--ease) 0.6s both;
}

.duration-wrap label {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--mid);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.duration-input {
  width: 60px;
  padding: 6px 10px;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  background: transparent;
  border: 1px solid #d0c8b8;
  border-radius: 2px;
  color: var(--ink);
  text-align: center;
  outline: none;
  transition: border-color 0.2s;
}

.duration-input:focus { border-color: var(--ink); }

.duration-wrap span {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--mid);
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,10,10,0.92);
  backdrop-filter: blur(12px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s var(--ease);
}

.modal-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.modal {
  background: #1a1a1a;
  color: var(--ink);
  border: 1px solid #2a2a2a;
  padding: 52px 56px;
  max-width: 420px;
  width: 90%;
  text-align: center;
  position: relative;
  transform: scale(0.88) translateY(20px);
  transition: transform 0.4s var(--ease);
  border-radius: 2px;
}

.modal-overlay.show .modal {
  transform: scale(1) translateY(0);
}

.modal-icon {
  font-size: 2.8rem;
  margin-bottom: 20px;
  display: block;
  animation: none;
}

.modal-overlay.show .modal-icon {
  animation: popIn 0.5s var(--ease) 0.2s both;
}

@keyframes popIn {
  from { transform: scale(0); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

.modal-title {
  font-family: var(--font-num);
  font-size: 2.8rem;
  letter-spacing: 0.06em;
  margin-bottom: 10px;
  color: var(--ink);
}

.modal-msg {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--mid);
  letter-spacing: 0.08em;
  line-height: 1.8;
  margin-bottom: 32px;
}

.modal-btn {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 12px 32px;
  background: var(--ink);
  color: #111111;
  border: none;
  border-radius: 2px;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
}

.modal-btn:hover { background: #cccccc; }
.modal-btn:active { transform: scale(0.96); }

/* Confetti dots */
.confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 99;
}

.dot {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  animation: fall linear both;
}

@keyframes fall {
  from { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  to   { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 480px) {
  .modal { padding: 36px 28px; }
  .modal-title { font-size: 2rem; }
  .controls { flex-direction: column; align-items: center; }
  .btn { width: 200px; text-align: center; }
}
</style>
</head>
<body>

<!-- Decorative bg number -->
<div class="deco-num" id="decoNum">10</div>

<div class="wrapper">
  <div class="label-top">⟡ Countdown Timer</div>

  <!-- SVG Ring -->
  <div class="ring-wrap" id="ringWrap">
    <svg class="ring-svg" viewBox="0 0 120 120" id="ringSvg">
      <circle class="ring-bg-circle" cx="60" cy="60" r="54"/>
      <circle class="ring-progress" id="ringProgress" cx="60" cy="60" r="54"
              stroke-dasharray="339.292"
              stroke-dashoffset="0"/>
    </svg>

    <div class="time-center">
      <div class="time-display" id="timeDisplay">
        10<span class="colon" id="colon">:</span>00
      </div>
      <div class="time-sub" id="timeSub">minutos restantes</div>
    </div>
  </div>

  <!-- Linear progress -->
  <div class="progress-bar-wrap">
    <div class="progress-label">
      <span>0%</span>
      <span id="pctLabel">0% đã qua</span>
      <span>100%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">Bắt đầu</button>
    <button class="btn btn-secondary" onclick="resetTimer()">Đặt lại</button>
  </div>

  <!-- Custom duration -->
  <div class="duration-wrap">
    <label for="durationInput">Thời gian:</label>
    <input type="number" class="duration-input" id="durationInput" value="10" min="1" max="99">
    <span>phút</span>
    <button class="btn btn-secondary" style="padding:6px 14px;font-size:0.62rem;" onclick="applyDuration()">OK</button>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <span class="modal-icon">⏰</span>
    <div class="modal-title">Hết giờ!</div>
    <div class="modal-msg">
      Thời gian đếm ngược đã kết thúc.<br>
      <span id="modalTime" style="color:var(--bg);"></span>
    </div>
    <button class="modal-btn" onclick="closeModal()">Bắt đầu lại</button>
  </div>
</div>

<!-- Confetti container -->
<div class="confetti" id="confetti"></div>

<script>
/* ================================================================
   STATE
   ================================================================ */
const TOTAL_DURATION = 10 * 60; // giây — thay đổi khi user custom

let totalSeconds  = TOTAL_DURATION;
let remaining     = totalSeconds;
let intervalId    = null;   // ID của setInterval — dùng để clearInterval
let isRunning     = false;
let startEpoch    = null;   // Timestamp lúc bắt đầu (để sync chính xác)

/* ================================================================
   CIRCUMFERENCE của vòng tròn SVG
   r = 54 → C = 2π × 54 ≈ 339.292
   ================================================================ */
const CIRCUMFERENCE = 2 * Math.PI * 54; // 339.292

/* ================================================================
   DOM REFS
   ================================================================ */
const timeEl      = document.getElementById('timeDisplay');
const colonEl     = document.getElementById('colon');
const subEl       = document.getElementById('timeSub');
const startBtn    = document.getElementById('startBtn');
const ringProg    = document.getElementById('ringProgress');
const ringWrap    = document.getElementById('ringWrap');
const fillEl      = document.getElementById('progressFill');
const pctLabelEl  = document.getElementById('pctLabel');
const decoEl      = document.getElementById('decoNum');

/* ================================================================
   FORMAT MM:SS
   ================================================================ */
function formatTime(secs) {
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return {
    mm: String(m).padStart(2, '0'),
    ss: String(s).padStart(2, '0'),
  };
}

/* ================================================================
   RENDER UI — cập nhật tất cả visual từ `remaining`
   ================================================================ */
function render() {
  const { mm, ss } = formatTime(remaining);

  // Cập nhật số giờ — xây dựng innerHTML an toàn
  timeEl.innerHTML = `${mm}<span class="colon ${isRunning ? 'pulse' : ''}" id="colon">:</span>${ss}`;

  // Cập nhật decorative bg number
  decoEl.textContent = mm;

  // Ring progress
  // offset = CIRCUMFERENCE × (remaining / total)  → đầy = 0, rỗng = CIRCUMFERENCE
  const ratio  = remaining / totalSeconds;
  const offset = CIRCUMFERENCE * (1 - ratio);
  ringProg.style.strokeDashoffset = offset;

  // Linear progress bar
  const pct = Math.round((1 - ratio) * 100);
  fillEl.style.width = (ratio * 100) + '%';
  pctLabelEl.textContent = pct + '% đã qua';

  // Sub label
  subEl.textContent = remaining > 0
    ? (remaining > 60 ? 'phút còn lại' : 'giây còn lại')
    : 'Hết giờ';

  // ── TRẠNG THÁI MÀU SẮC ──
  const isWarn   = remaining <= 60 && remaining > 10;
  const isUrgent = remaining <= 10 && remaining > 0;

  timeEl.classList.toggle('warn',   isWarn);
  timeEl.classList.toggle('urgent', isUrgent);
  ringProg.classList.toggle('warn',   isWarn);
  ringProg.classList.toggle('urgent', isUrgent);
  ringWrap.classList.toggle('warn-active',   isWarn);
  ringWrap.classList.toggle('urgent-active', isUrgent);
  fillEl.style.background = isUrgent ? 'var(--accent)' : isWarn ? 'var(--warn)' : 'var(--safe)';
}

/* ================================================================
   TICK — gọi mỗi 1 giây bởi setInterval

   CHỐNG DRIFT: Thay vì đơn giản `remaining--`, ta dùng
   timestamp epoch để tính thời gian thực đã trôi qua.
   setInterval không chính xác tuyệt đối (có thể lệch vài ms/lần),
   sau 10 phút sai lệch tích lũy có thể lên đến vài giây.
   Cách fix: lưu `startEpoch` → mỗi tick tính lại từ đầu.
   ================================================================ */
function tick() {
  // Tính thời gian thực đã trôi qua tính từ lúc bắt đầu
  const elapsed = Math.floor((Date.now() - startEpoch) / 1000);
  remaining = Math.max(0, totalSeconds - elapsed);

  render();

  if (remaining <= 0) {
    stopTimer();
    showModal();
  }
}

/* ================================================================
   TOGGLE START / PAUSE
   ================================================================ */
function toggleTimer() {
  if (isRunning) {
    pauseTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  if (remaining <= 0) return;

  isRunning  = true;
  // Lưu epoch có tính đến phần thời gian đã dừng trước đó
  startEpoch = Date.now() - (totalSeconds - remaining) * 1000;

  /*
   * TRÁNH MEMORY LEAK:
   * Luôn clearInterval trước khi setInterval mới.
   * Nếu setInterval được gọi nhiều lần mà không clear,
   * sẽ tạo nhiều interval chạy song song → tốn CPU + hành vi sai.
   */
  clearInterval(intervalId);
  intervalId = setInterval(tick, 200); // 200ms để responsive hơn, tick tự tính đúng giây

  startBtn.textContent = 'Tạm dừng';
  render();
}

function pauseTimer() {
  isRunning = false;
  clearInterval(intervalId); // ← Xoá interval, giải phóng memory
  intervalId = null;
  startBtn.textContent = 'Tiếp tục';
  render();
}

function stopTimer() {
  isRunning = false;
  clearInterval(intervalId); // ← Luôn clear khi dừng
  intervalId = null;
  startBtn.textContent = 'Bắt đầu';
}

/* ================================================================
   RESET
   ================================================================ */
function resetTimer() {
  stopTimer();
  remaining = totalSeconds;
  render();
  startBtn.textContent = 'Bắt đầu';
}

/* ================================================================
   CUSTOM DURATION
   ================================================================ */
function applyDuration() {
  const val = parseInt(document.getElementById('durationInput').value, 10);
  if (!val || val < 1 || val > 99) return;

  stopTimer();
  totalSeconds = val * 60;
  remaining    = totalSeconds;
  render();
  startBtn.textContent = 'Bắt đầu';
}

/* ================================================================
   MODAL
   ================================================================ */
function showModal() {
  const now = new Date().toLocaleTimeString('vi-VN');
  document.getElementById('modalTime').textContent = 'Kết thúc lúc ' + now;
  document.getElementById('modalOverlay').classList.add('show');
  spawnConfetti();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('confetti').innerHTML = '';
  resetTimer();
}

/* ================================================================
   CONFETTI
   ================================================================ */
function spawnConfetti() {
  const container = document.getElementById('confetti');
  container.innerHTML = '';
  const colors = ['#d4450a','#e8a020','#1a1008','#c8a96e','#5c8a5c'];

  for (let i = 0; i < 60; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.cssText = `
      left: ${Math.random() * 100}%;
      top: ${-Math.random() * 20}px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      width: ${4 + Math.random() * 6}px;
      height: ${4 + Math.random() * 6}px;
      animation-duration: ${2 + Math.random() * 3}s;
      animation-delay: ${Math.random() * 1.5}s;
    `;
    container.appendChild(dot);
  }

  // Dọn confetti sau 6 giây tránh DOM thừa
  setTimeout(() => { container.innerHTML = ''; }, 6000);
}

/* ================================================================
   KEYBOARD SHORTCUTS
   ================================================================ */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); toggleTimer(); }
  if (e.code === 'KeyR')  resetTimer();
});

/* ================================================================
   VISIBILITY API — Tạm dừng khi tab bị ẩn, tiếp tục khi quay lại
   Dùng document.hidden để tránh interval chạy ngầm lãng phí CPU
   ================================================================ */
document.addEventListener('visibilitychange', () => {
  if (document.hidden && isRunning) {
    // Tab bị ẩn — không cần clear, startEpoch vẫn đúng
    // interval vẫn chạy nhưng khi quay lại sẽ tự sync
  }
  // Khi quay lại, tick() tự tính lại từ epoch → không bị lệch
});

/* ================================================================
   INIT
   ================================================================ */
render();
</script>
</body>
</html>
